name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK
        run: |
          curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-7302050_latest.zip -o sdk.zip
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          unzip -q sdk.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "build-tools;30.0.3" "build-tools;35.0.0" "platforms;android-35" "platform-tools" "ndk;21.4.7075529"
          cp "$ANDROID_HOME/build-tools/30.0.3/dx" "$ANDROID_HOME/build-tools/35.0.0/dx"
          cp "$ANDROID_HOME/build-tools/30.0.3/lib/dx.jar" "$ANDROID_HOME/build-tools/35.0.0/lib/dx.jar"
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Build APK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/21.4.7075529"
          export PATH="$ANDROID_NDK_HOME:$PATH"
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          mkdir -p TMessagesProj_AppStandalone/build/outputs/apk
          ./gradlew -no-daemon :TMessagesProj_AppStandalone:assembleAfatStandalone --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: gramsrv-apk
          path: |
            TMessagesProj_AppStandalone/build/outputs/apk/*/*.apk
            TMessagesProj_AppStandalone/build/outputs/apk/*.apk
          if-no-files-found: error